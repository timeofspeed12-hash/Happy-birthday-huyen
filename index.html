<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Huyền</title>
    <style>
        /* CSS Cơ bản & Thiết lập nền */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0b2e, #4b1d52, #e83e8c, #1a0b2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            user-select: none;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Màn hình Bắt đầu (Bypass Autoplay) */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 11, 46, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            color: #fff;
            background: transparent;
            border: 2px solid #ff69b4;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff69b4, inset 0 0 15px #ff69b4;
            transition: all 0.3s;
            animation: pulseBtn 1.5s infinite;
        }
        #start-btn:hover {
            background: #ff69b4;
            box-shadow: 0 0 30px #ff69b4, inset 0 0 20px #fff;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Container chính chứa chữ */
        #main-content {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none; /* Để click được nút nhạc xuyên qua */
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        /* Tiêu đề Neon */
        .neon-title {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 
                0 0 5px #fff, 
                0 0 10px #fff, 
                0 0 20px #ff00de, 
                0 0 40px #ff00de, 
                0 0 80px #ff00de, 
                0 0 100px #ff00de;
            animation: neonPulse 1.5s infinite alternate;
        }
        .neon-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            text-align: center;
            max-width: 90%;
            line-height: 1.5;
            color: #fff;
            text-shadow: 0 0 5px #ffb6c1, 0 0 10px #ff69b4, 0 0 15px #ff69b4;
        }
        @keyframes neonPulse {
            0% { transform: scale(1); text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff00de, 0 0 40px #ff00de; }
            100% { transform: scale(1.03); text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 30px #ff00de, 0 0 60px #ff00de, 0 0 100px #ff00de; }
        }

        /* Nút Bật/Tắt Nhạc */
        #music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 105, 180, 0.3);
            border: 1px solid #ffb6c1;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255,105,180,0.5);
            transition: 0.3s;
        }
        #music-toggle:hover {
            background: rgba(255, 105, 180, 0.6);
        }

        /* Các phần tử được render bằng JS (DOM Effects) */
        #elements-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }
        
        /* Cấu hình ảnh bay */
        .bouncing-img {
            position: absolute;
            top: 0; left: 0;
            width: clamp(70px, 12vw, 100px);
            height: clamp(70px, 12vw, 100px);
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 0 10px #ffb6c1, 0 0 20px #ff69b4, 0 0 30px #ff1493;
            will-change: transform; /* Tối ưu FPS */
        }

        /* Chữ rơi */
        .falling-text {
            position: absolute;
            top: 0; left: 0;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(255,255,255,0.8);
            will-change: transform;
        }

        /* Hoa hồng viền dưới */
        .roses-bottom {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 2rem;
            z-index: 8;
            pointer-events: none;
            filter: drop-shadow(0 0 10px #ff1493);
        }

        /* Bóng bay CSS */
        .balloon {
            position: absolute;
            bottom: -100px;
            font-size: 2.5rem;
            animation: floatUp linear infinite;
            will-change: transform;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }

        /* Canvas Particle Effects */
        #effects-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Màn hình mở đầu -->
    <div id="start-screen">
        <button id="start-btn">Bắt đầu 🎁</button>
    </div>

    <!-- Nút điều khiển nhạc -->
    <button id="music-toggle" style="display: none;">🔊 Tắt nhạc</button>
    
    <!-- Audio Element -->
    <audio id="bg-music" src="KHÚC HÁT MỪNG SINH NHẬT - PHAN ĐINH TÙNG ( OFFICIAL VIDEO).mp3" loop></audio>

    <!-- Canvas cho pháo hoa và hạt lấp lánh -->
    <canvas id="effects-canvas"></canvas>

    <!-- Container cho các thẻ DOM (Ảnh, Chữ rơi, Bóng bay...) -->
    <div id="elements-container"></div>

    <!-- Container Nội dung chính -->
    <div id="main-content">
        <h1 class="neon-title">🎂 Happy Birthday Huyền ❤️</h1>
        <p class="neon-subtitle">Chúc Huyền tuổi mới luôn vui vẻ, xinh đẹp, học giỏi và đỗ NV1 nhé! 💖</p>
    </div>

    <!-- Hàng hoa hồng mép dưới -->
    <div class="roses-bottom" id="roses-container"></div>

    <script>
        // === BIẾN TOÀN CỤC ===
        let w = window.innerWidth;
        let h = window.innerHeight;
        const canvas = document.getElementById('effects-canvas');
        const ctx = canvas.getContext('2d');
        const elementsContainer = document.getElementById('elements-container');
        
        canvas.width = w;
        canvas.height = h;
        
        window.addEventListener('resize', () => {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
        });

        // === DANH SÁCH TEXT & ICON ===
        const fallingMessages = [
            "🎂 Chúc mừng sinh nhật Huyền",
            "🌸 Chúc Huyền tuổi mới thêm xinh",
            "💕 Chúc Huyền xinh đẹp",
            "📚 Chúc Huyền tuổi mới học giỏi",
            "🎓 Chúc Huyền đỗ NV1",
            "✨ Mãi lung linh tỏa sáng",
            "💖 Vui vẻ mỗi ngày nhé!"
        ];
        const emojis = ["❤️", "🌸", "✨", "💖", "💫"];

        // === QUẢN LÝ ẢNH BAY (BOUNCING IMAGES) ===
        class BouncingImg {
            constructor() {
                this.el = document.createElement('img');
                // Sử dụng chính xác file ảnh theo yêu cầu hệ thống
                this.el.src = 'Messenger_creation_1069313662721295.jpeg';
                this.el.className = 'bouncing-img';
                
                // Hiệu ứng Fade in ban đầu bay từ ngoài vào
                this.x = (Math.random() > 0.5 ? -100 : w + 100);
                this.y = Math.random() * h;
                
                // Khởi tạo vận tốc ngẫu nhiên
                this.vx = (Math.random() * 3 + 1.5) * (this.x < 0 ? 1 : -1);
                this.vy = (Math.random() * 3 + 1.5) * (Math.random() > 0.5 ? 1 : -1);
                
                this.rot = Math.random() * 360;
                this.vrot = (Math.random() - 0.5) * 3; 
                
                // Phóng to thu nhỏ nhẹ
                this.baseScale = 0.8 + Math.random() * 0.4;
                this.scaleAngle = Math.random() * Math.PI * 2;
                
                elementsContainer.appendChild(this.el);
            }

            update() {
                // Kích thước của ảnh (ước lượng theo css clamp)
                let size = this.el.getBoundingClientRect().width || 80;

                this.x += this.vx;
                this.y += this.vy;
                this.rot += this.vrot;
                this.scaleAngle += 0.02;
                let currentScale = this.baseScale + Math.sin(this.scaleAngle) * 0.1;

                // Xử lý bật mép (Collision)
                if (this.x <= 0) { this.x = 0; this.vx *= -1; }
                if (this.x + size >= w) { this.x = w - size; this.vx *= -1; }
                if (this.y <= 0) { this.y = 0; this.vy *= -1; }
                if (this.y + size >= h) { this.y = h - size; this.vy *= -1; }

                this.el.style.transform = `translate(${this.x}px, ${this.y}px) rotate(${this.rot}deg) scale(${currentScale})`;
            }
        }

        // === QUẢN LÝ CHỮ RƠI & BIỂU TƯỢNG RƠI ===
        class FallingElement {
            constructor(isText = true) {
                this.el = document.createElement('div');
                this.el.className = 'falling-text';
                this.isText = isText;
                
                if (isText) {
                    this.el.innerText = fallingMessages[Math.floor(Math.random() * fallingMessages.length)];
                    this.el.style.color = `hsl(${Math.random() * 60 + 300}, 100%, 80%)`; // Tông hồng/tím
                    this.el.style.fontSize = `${14 + Math.random() * 12}px`;
                } else {
                    this.el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    this.el.style.fontSize = `${16 + Math.random() * 15}px`;
                }
                
                elementsContainer.appendChild(this.el);
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * w;
                this.y = initial ? Math.random() * h : -50;
                this.vy = 1 + Math.random() * 2;
                this.vx = (Math.random() - 0.5) * 1;
                this.rot = Math.random() * 360;
                this.vrot = (Math.random() - 0.5) * 2;
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.rot += this.vrot;

                if (this.y > h + 50) this.reset();

                this.el.style.transform = `translate(${this.x}px, ${this.y}px) rotate(${this.rot}deg)`;
            }
        }

        // === QUẢN LÝ BÓNG BAY (BALLOONS) ===
        function createBalloons() {
            const balloonColors = ['🎈', '💖', '🎈'];
            setInterval(() => {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.innerText = balloonColors[Math.floor(Math.random() * balloonColors.length)];
                balloon.style.left = `${Math.random() * 100}vw`;
                balloon.style.animationDuration = `${5 + Math.random() * 5}s`;
                elementsContainer.appendChild(balloon);

                setTimeout(() => {
                    balloon.remove();
                }, 10000);
            }, 1500);
        }

        // === HOA HỒNG DƯỚI MÉP ===
        function createRoses() {
            const roseContainer = document.getElementById('roses-container');
            let count = Math.floor(w / 40);
            for(let i = 0; i < count; i++) {
                let rose = document.createElement('span');
                rose.innerText = '🌹';
                roseContainer.appendChild(rose);
            }
        }

        // === HỆ THỐNG PHÁO HOA & CANVAS PARTICLES ===
        let fireworks = [];
        let particles = [];
        let stars = [];

        // Tạo sao nhấp nháy nền
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 2,
                alpha: Math.random(),
                dAlpha: (Math.random() - 0.5) * 0.05
            });
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            update() {
                this.vx *= 0.95; // Ma sát
                this.vy *= 0.95;
                this.vy += 0.05; // Trọng lực nhẹ
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        class Firework {
            constructor() {
                this.x = Math.random() * w;
                this.y = h;
                this.targetY = Math.random() * (h / 2);
                this.vy = -(Math.random() * 3 + 4);
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.exploded = false;
            }
            update() {
                if(!this.exploded) {
                    this.y += this.vy;
                    if(this.y <= this.targetY) {
                        this.exploded = true;
                        this.explode();
                    }
                }
            }
            draw() {
                if(!this.exploded) {
                    ctx.globalAlpha = 1;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }
            explode() {
                for(let i=0; i<50; i++) {
                    particles.push(new Particle(this.x, this.y, this.color));
                }
            }
        }

        // Tự động bắn pháo hoa
        setInterval(() => {
            if(Math.random() > 0.4) fireworks.push(new Firework());
        }, 800);


        // === VÒNG LẶP ANIMATION (60 FPS) ===
        let domElements = [];

        function initDOMAnimations() {
            // Khởi tạo 15 ảnh
            for (let i = 0; i < 15; i++) {
                domElements.push(new BouncingImg());
            }
            // Khởi tạo 15 dòng chữ rơi
            for (let i = 0; i < 15; i++) {
                domElements.push(new FallingElement(true));
            }
            // Khởi tạo 20 biểu tượng rơi (tim, hoa)
            for (let i = 0; i < 20; i++) {
                domElements.push(new FallingElement(false));
            }
        }

        function animate() {
            // Xóa Canvas (để nền mờ tạo đuôi pháo hoa nhưng không đè mất nền gradient)
            ctx.clearRect(0, 0, w, h);
            
            // Vẽ Sao
            stars.forEach(star => {
                star.alpha += star.dAlpha;
                if(star.alpha <= 0 || star.alpha >= 1) star.dAlpha *= -1;
                ctx.globalAlpha = Math.max(0, Math.min(1, star.alpha));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            });

            // Vẽ Pháo hoa
            for(let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if(fireworks[i].exploded) fireworks.splice(i, 1);
            }

            // Vẽ Hạt pháo hoa
            for(let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if(particles[i].alpha <= 0) particles.splice(i, 1);
            }

            // Cập nhật các phần tử DOM (ảnh, chữ)
            domElements.forEach(el => el.update());

            requestAnimationFrame(animate);
        }

        // === LOGIC XỬ LÝ SỰ KIỆN ===
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const mainContent = document.getElementById('main-content');
        const audio = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');

        startBtn.addEventListener('click', () => {
            // Phát nhạc
            audio.play().catch(e => console.log("Trình duyệt chặn Audio: ", e));
            
            // Ẩn màn hình Start
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                // Hiện nội dung chính
                mainContent.style.opacity = '1';
                musicToggle.style.display = 'block';
                
                // Kích hoạt tất cả hiệu ứng
                initDOMAnimations();
                createBalloons();
                createRoses();
                
                // Bắn một loạt pháo hoa chào mừng
                for(let i=0; i<5; i++) {
                    setTimeout(() => fireworks.push(new Firework()), i * 200);
                }
                
                animate();
            }, 1000);
        });

        // Xử lý nút bật/tắt nhạc
        musicToggle.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                musicToggle.innerText = '🔊 Tắt nhạc';
            } else {
                audio.pause();
                musicToggle.innerText = '🔇 Bật nhạc';
            }
        });

    </script>
</body>
</html>
